name: Build AndroidIDE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout AndroidIDE
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build Sora Editor
        run: |
          cd "$RUNNER_TEMP"
          git clone https://github.com/Rosemoe/sora-editor.git sora-editor
          cd sora-editor
          git checkout 3895689c
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon

      - name: Build AndroidIDE
        run: |
          chmod +x gradlew
          ./gradlew :core:app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidIDE-debug
          path: |
            core/app/build/outputs/apk/**/*.apk
